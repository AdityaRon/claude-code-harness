# skill_lint waivers (skills/skill-forge/bin/skill_lint.py). comms-hub predates
# skill-forge and runs on every tick of a live session. C1, C3 and the C8
# description were fixed; these three stay because the fix would break or risk
# that session. The lint fails a waiver with no reason, or one whose check passes.

[C6]
reason = "Settled (2026-11-12): stays waived. hub.py panel's stdout is parsed as JSON by the panel (panel/hooks/register.tsx:87, JSON.parse(out.stdout)), so a provenance header in front of it breaks the panel. The rest is queue, draft and tick state the comms session acts on, not an answer pasted elsewhere."

[C7]
reason = "Settled (2026-11-12): stays waived. A vendored mask.py reads skill-forge's config, so a mask pattern added for a forged skill would also rewrite the names and repos comms-hub routes on. Its 8 scripts print directly (144 lines with print(, grep -c over bin/*.py on 2026-11-11), and check_draft.py already scans every outgoing Slack draft for secrets and names."

[C8]
reason = "SKILL.md is 496 lines (wc -l, 2026-11-12), over the 150-line budget, and the tick section alone is 335. The peer section moved to the slack-draft skill on 2026-11-12, so a session that only sends Slack no longer loads this file; what is left is what the comms session runs each tick. Moving the tick into a file of its own would change what that session re-reads after compaction, which no test here exercises."
