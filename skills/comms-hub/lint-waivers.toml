# skill_lint waivers (skills/skill-forge/bin/skill_lint.py). comms-hub predates
# skill-forge and runs on every tick of a live session; each finding below is
# recorded rather than changed in the PR that added the lint. The lint fails a
# waiver with no reason, or one whose check passes, so these go when fixed.

[C1]
reason = "review_lint.py's only write, the review POST, is gated by its own --post flag: without it the script lints and posts nothing, which is the dry run convention 1 asks for under another name. Renaming the flag would break the commands the comms tick already runs."

[C3]
reason = "The two hits (tests/test_check_draft.py:159 and :161) are fake secret shapes that test check_draft.py's own secret detector. They are built from fragments or marked EXAMPLE, and are not credentials."

[C6]
reason = "comms-hub's output is queue, panel and draft state read by one session, not an answer pasted elsewhere, so it carries no provenance header. Adding header() to its 8 scripts is a change of its own."

[C7]
reason = "Its 8 scripts print directly (142 lines with print(, grep -c on 2026-11-10). check_draft.py already scans every outgoing Slack draft for secrets and names. Routing output through mask.emit is a change of its own."

[C8]
reason = "The description says 'Use in the one long-lived comms session on each tick', the phrasing its triggering was tuned for, not the literal 'Use when'. SKILL.md is 512 lines (budget 150) because it is the comms protocol, and it loads only in the comms session. Slimming it is a change of its own."
