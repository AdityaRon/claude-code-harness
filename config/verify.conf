# The commit verification stamp: a `Verified:` trailer naming what ran, or
# `Verified: none (<why>)`. tools/verify-stamp.sh lists a PR's commits without one,
# and reads this file from the base branch, so a PR cannot change its own mode.
#   off      not checked
#   observe  listed in the CI job summary; the step passes
#   enforce  listed, and the step fails
mode=observe
