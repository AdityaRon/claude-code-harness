name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: doctor.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        # Drop the runner image's preinstalled third-party apt sources first.
        # `apt-get update` exits 100 if ANY configured source fails, and the
        # google-chrome list on ubuntu-latest served a Packages.gz whose hash
        # did not match its Release file — failing every Linux job here in the
        # dependency step, before a line of harness code ran, while macOS
        # passed the same suite on the same commit. Nothing in this repo needs
        # Chrome, so removing the source is a fix and not a workaround; the
        # `|| true` covers the file simply not existing on a future image.
        # Deliberately NOT `apt-get update || true`: that would also swallow a
        # genuine failure to reach the Ubuntu archives.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq || true

      - name: Run the hook test suite
        run: bash doctor.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # See the note on "Install jq (Linux)" above: a broken third-party apt
        # source on the runner image fails apt-get update for the whole job.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list || true
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint hooks and scripts
        # Glob the directories rather than naming each script, so a new tool is
        # linted the day it lands instead of the day someone remembers.
        run: shellcheck -S warning hooks/*.sh bin/*.sh ./*.sh
