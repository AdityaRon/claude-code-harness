name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: doctor.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Without a limit a hung step waits 6 hours. macOS took 17m51s to 18m34s
    # on main's runs of 2026-11-13 and 11-14, so 20 cut off the next suite added.
    timeout-minutes: 30
    steps:
      # Every tag: tests/skills-sync.test.sh installs v1.4.2 and upgrades from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # strace: tests/hook-bench.test.sh's --launches strace cases, which skip without it.
      - name: Install jq and strace (Linux)
        if: runner.os == 'Linux'
        # See .github/install-apt-deps.sh for why this is not a plain apt-get.
        run: .github/install-apt-deps.sh jq strace

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq || true

      # The skills' heredoc and token-shape readers need 3.10+ with tomllib; pinned so both OSes run the same one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suites that read the skills (skills-sync, token-shapes, heredoc-openers)
      # take them from a clone at the pinned commit and fail in CI without one.
      - name: Clone claude-code-skills
        run: |
          git clone --quiet "$(sed -n 's/^url=//p' config/skills.pin)" "$RUNNER_TEMP/skills"
          echo "CCH_SKILLS_CLONE=$RUNNER_TEMP/skills" >> "$GITHUB_ENV"

      - name: Run the hook test suite
        run: bash doctor.sh

  bench:
    name: hook benchmark vs main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq and strace
        run: .github/install-apt-deps.sh jq strace

      # Every payload, as the release gate runs them: every third (--quick) let a
      # decision change through that the release then blocked on (#251). With
      # hooks/ and config/settings.json as on the base, both sides would run the
      # same files, so it is skipped, as release.yml does. A decision the PR means
      # to change is declared in its body: `intended-decisions: <payload ids>`.
      # --launches strace counts the processes each hook starts per payload, and
      # the gate fails a payload whose hooks start more than on the base, unless
      # the body names it: `intended-launches: <payload ids>`. The gate script and
      # corpus are the base's (.github/bench-gate.sh); a payload the PR removes or
      # changes is named in its body: `removed-payloads: <payload ids>`.
      - name: Benchmark this PR's hooks against the base branch
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          INTENDED=$(printf '%s\n' "$PR_BODY" | sed -nE 's/^intended-decisions:[[:space:]]*//p' | tr '\n' ' ')
          INTENDED_LAUNCHES=$(printf '%s\n' "$PR_BODY" | sed -nE 's/^intended-launches:[[:space:]]*//p' | tr '\n' ' ')
          REMOVED=$(printf '%s\n' "$PR_BODY" | sed -nE 's/^removed-payloads:[[:space:]]*//p' | tr '\n' ' ')
          export INTENDED INTENDED_LAUNCHES REMOVED
          .github/bench-gate.sh "origin/$BASE"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # See .github/install-apt-deps.sh for why this is not a plain apt-get.
        run: .github/install-apt-deps.sh shellcheck
      - name: Lint hooks and scripts
        # Glob the directories rather than naming each script, so a new tool is
        # linted the day it lands instead of the day someone remembers. .github
        # is in the list because CI's own helpers are shell too, and a broken
        # one fails every job before anything else gets a chance to run.
        run: shellcheck -S warning hooks/*.sh hooks/lib/*.sh bin/*.sh tools/*.sh ./*.sh .github/*.sh
      - name: Lint the test suites
        # Errors only: the suites carry warnings (SC2015's `a && b || c` as a
        # pass/fail line) that are their idiom, while an error is a broken test.
        run: shellcheck -x -S error tests/*.sh

  python-compile:
    # A syntax error in a script no test imports fails nothing else. The oldest
    # interpreter any of them runs under is macOS's /usr/bin/python3 (3.9), so
    # compile with that one; setup-python has no 3.9 for current Ubuntu.
    name: python compile
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile every Python file
        run: |
          /usr/bin/python3 --version
          git ls-files -z '*.py' | xargs -0 /usr/bin/python3 -m py_compile
