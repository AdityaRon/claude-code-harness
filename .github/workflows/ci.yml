name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: doctor.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS takes about 4 minutes. Without a limit a hung step waits 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        # See .github/install-apt-deps.sh for why this is not a plain apt-get.
        run: .github/install-apt-deps.sh jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq || true

      # tests/comms-hub.test.sh needs 3.10+ with tomllib; pinned so both OSes run the same one.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the hook test suite
        run: bash doctor.sh

  bench:
    name: hook benchmark vs main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: .github/install-apt-deps.sh jq

      # Every third payload keeps this near a minute. A decision the PR means to
      # change is declared in its body: `intended-decisions: <payload ids>`.
      - name: Benchmark this PR's hooks against the base branch
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          INTENDED=$(printf '%s\n' "$PR_BODY" | sed -nE 's/^intended-decisions:[[:space:]]*//p' | tr '\n' ' ')
          set +e
          python3 tools/hook-bench.py --base "origin/$BASE" --head HEAD --quick --gate --intended "$INTENDED" --md bench.md >/dev/null
          RC=$?
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
          [ "$RC" = 0 ] || echo "::error::the benchmark gate failed; see the job summary."
          exit $RC

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # See .github/install-apt-deps.sh for why this is not a plain apt-get.
        run: .github/install-apt-deps.sh shellcheck
      - name: Lint hooks and scripts
        # Glob the directories rather than naming each script, so a new tool is
        # linted the day it lands instead of the day someone remembers. .github
        # is in the list because CI's own helpers are shell too, and a broken
        # one fails every job before anything else gets a chance to run.
        run: shellcheck -S warning hooks/*.sh bin/*.sh tools/*.sh ./*.sh .github/*.sh skills/*/bin/*.sh
      - name: Lint the test suites
        # Errors only: the suites carry warnings (SC2015's `a && b || c` as a
        # pass/fail line) that are their idiom, while an error is a broken test.
        run: shellcheck -x -S error tests/*.sh

  python-compile:
    # A syntax error in a script no test imports fails nothing else. The oldest
    # interpreter any of them runs under is macOS's /usr/bin/python3 (3.9), so
    # compile with that one; setup-python has no 3.9 for current Ubuntu.
    name: python compile
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile every Python file
        run: |
          /usr/bin/python3 --version
          git ls-files -z '*.py' | xargs -0 /usr/bin/python3 -m py_compile
