name: Guard properties daily

# tools/guard-props.py once a day on a new seed. Its own workflow, not a job in
# release.yml, so a counterexample never turns a Release run red: that run's
# color is the release's alone. The seed is printed so a failure repeats; a
# counterexample opens one issue, or comments on the open one, and its input
# goes into tests/bench-corpus.jsonl by PR (docs/guards.md). PRs run the same
# script on a fixed seed in ci.yml.
on:
  schedule:
    - cron: '47 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-props:
    name: guard properties, random seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: write keeps the counterexample issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the guard properties on a random seed
        id: props
        run: |
          command -v jq >/dev/null || .github/install-apt-deps.sh jq
          S=$SECONDS; RC=0
          python3 tools/guard-props.py --seed random > props.txt || RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          { echo '```'; cat props.txt; echo '```'; echo "$((SECONDS - S)) s."; } >> "$GITHUB_STEP_SUMMARY"
          cat props.txt
          [ "$RC" = 0 ] || echo "::error::a guard property failed; the summary has the seed, each input and its corpus line."
          exit $RC
      # Exit 1 is a counterexample; exit 2, a check that could not run, stays a red run.
      - name: Record a counterexample in an issue
        if: failure() && steps.props.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SEED=$(sed -n 's/^guard-props: seed \([0-9]*\) .*/\1/p' props.txt | head -1)
          {
            echo "Run: $RUN"
            echo
            echo "\`tools/guard-props.py --seed $SEED\` repeats it. Add each corpus line below to tests/bench-corpus.jsonl by PR with the fix (docs/guards.md), or, where the full guard over-reads what bash runs, an entry to tests/guard-props-approved.jsonl."
            echo
            echo '````'
            head -c 60000 props.txt
            echo '````'
          } > issue.md
          N=$(gh issue list --state open --search 'in:title "guard properties: counterexample"' --json number -q '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body-file issue.md
          else
            gh issue create --title "guard properties: counterexample (seed $SEED)" --body-file issue.md --assignee "$OWNER"
          fi
