# TEMPORARY: measures #218 on the runner the release gate uses. Removed before merge.
name: bench probe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    if: github.head_ref == 'bench-together'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "serial v1.3.1 vs head", base: v1.3.1, head: HEAD, mode: ""}
          - {name: "together v1.3.1 vs head", base: v1.3.1, head: HEAD, mode: "--together"}
          - {name: "together v1.3.1 vs v1.3.1", base: v1.3.1, head: v1.3.1, mode: "--together"}
          - {name: "together head vs head", base: HEAD, head: HEAD, mode: "--together"}
          - {name: "serial v1.3.1 vs pre-dispatcher", base: v1.3.1, head: d5e077e, mode: ""}
          - {name: "together v1.3.1 vs pre-dispatcher", base: v1.3.1, head: d5e077e, mode: "--together"}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/install-apt-deps.sh jq
      - name: Runner
        run: |
          echo "nproc $(nproc)"; bash --version | head -1; python3 --version
          cat > /tmp/ps.sh <<'EOF'
          burn() { local i=0; while (( i < 300000 )); do i=$((i + 1)); done; printf 'done\0'; }
          exec 10< <(burn) 11< <(burn)
          IFS= read -r -d '' a <&10; IFS= read -r -d '' b <&11
          exec 10<&- 11<&-
          EOF
          { cat /tmp/ps.sh; echo wait; } > /tmp/psw.sh
          python3 - <<'EOF'
          import resource, subprocess
          for n in ("/tmp/ps.sh", "/tmp/psw.sh"):
              r0 = resource.getrusage(resource.RUSAGE_CHILDREN); subprocess.run(["bash", n])
              r1 = resource.getrusage(resource.RUSAGE_CHILDREN)
              print(n, "CPU seen", round((r1.ru_utime - r0.ru_utime + r1.ru_stime - r0.ru_stime) * 1000), "ms")
          EOF
      - name: Bench
        run: |
          set +e
          python3 tools/hook-bench.py --base "${{ matrix.base }}" --head "${{ matrix.head }}" ${{ matrix.mode }} --gate --md bench.md --json bench.json >/dev/null
          echo "gate exit $?"
          cat bench.md
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
