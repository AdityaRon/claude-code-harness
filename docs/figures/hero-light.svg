<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">One Bash call through the harness</title>
<desc id="d">Diagram of one Bash call, left to right. The call goes to bash-guards, a dispatcher that parses it once with jq and forks the 7 Bash guards in parallel: env-guard, git-guard, interpreter-guard, kubectl-guard, network-guard, rm-guard and config-guard. Their answers merge, deny over ask over allow, and a deny ends the call there. Otherwise it goes on to Claude Code's permission rules, then to auto mode's classifier, which decides by judgment what no guard or rule names. A separate lane below holds the session hooks, which run outside the decision, audit after it on every call: session-start (at session start), pre-compact (before compaction), memory-lint (after a memory write), audit (every event, logged).</desc>
<rect x="0.5" y="0.5" width="879" height="403" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker></defs>
<text x="24" y="32" font-size="17" fill="#1f2328" font-weight="600">One Bash call, left to right</text>
<rect x="16" y="142" width="92" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="62" y="168" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Bash call</text>
<text x="62" y="185" font-size="13" fill="#59636e" text-anchor="middle">from Claude</text>
<rect x="132" y="130" width="126" height="84" rx="8" fill="#f6f8fa" stroke="#2a78d6" stroke-width="1.5"/>
<text x="195" y="151" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">bash-guards</text>
<text x="195" y="168" font-size="13" fill="#59636e" text-anchor="middle">one jq parse,</text>
<text x="195" y="185" font-size="13" fill="#59636e" text-anchor="middle">then a fork</text>
<text x="195" y="202" font-size="13" fill="#59636e" text-anchor="middle">per guard</text>
<path d="M108 172 L130 172" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
<text x="362" y="51" font-size="14" fill="#59636e" text-anchor="middle">7 guards, in parallel</text>
<rect x="292" y="63" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="362" y="80.5" font-size="14" fill="#1f2328" text-anchor="middle">env-guard</text>
<path d="M258 145 L290 76" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<path d="M432 76 L466 145" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<rect x="292" y="95" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="362" y="112.5" font-size="14" fill="#1f2328" text-anchor="middle">git-guard</text>
<path d="M258 154 L290 108" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<path d="M432 108 L466 154" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<rect x="292" y="127" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="362" y="144.5" font-size="14" fill="#1f2328" text-anchor="middle">interpreter-guard</text>
<path d="M258 163 L290 140" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<path d="M432 140 L466 163" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<rect x="292" y="159" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="362" y="176.5" font-size="14" fill="#1f2328" text-anchor="middle">kubectl-guard</text>
<path d="M258 172 L290 172" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<path d="M432 172 L466 172" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<rect x="292" y="191" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="362" y="208.5" font-size="14" fill="#1f2328" text-anchor="middle">network-guard</text>
<path d="M258 181 L290 204" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<path d="M432 204 L466 181" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<rect x="292" y="223" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="362" y="240.5" font-size="14" fill="#1f2328" text-anchor="middle">rm-guard</text>
<path d="M258 190 L290 236" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<path d="M432 236 L466 190" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<rect x="292" y="255" width="140" height="26" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="362" y="272.5" font-size="14" fill="#1f2328" text-anchor="middle">config-guard</text>
<path d="M258 199 L290 268" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<path d="M432 268 L466 199" stroke="#8c959f" stroke-width="1.2" fill="none" marker-end="url(#head)"/>
<rect x="468" y="130" width="146" height="84" rx="8" fill="#f6f8fa" stroke="#2a78d6" stroke-width="1.5"/>
<text x="541" y="151" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">deny &gt; ask &gt; allow</text>
<text x="541" y="168" font-size="13" fill="#59636e" text-anchor="middle">strongest answer</text>
<text x="541" y="185" font-size="13" fill="#59636e" text-anchor="middle">wins; a deny</text>
<text x="541" y="202" font-size="13" fill="#59636e" text-anchor="middle">ends the call</text>
<path d="M614 172 L640 172" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
<rect x="642" y="86" width="222" height="172" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="753" y="110" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Claude Code</text>
<rect x="656" y="126" width="194" height="46" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="753" y="145" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">permission rules</text>
<text x="753" y="162" font-size="13" fill="#59636e" text-anchor="middle">deny, ask, allow lists</text>
<path d="M753 172 L753 186" stroke="#8c959f" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
<rect x="656" y="188" width="194" height="46" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="753" y="207" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">auto mode classifier</text>
<text x="753" y="224" font-size="13" fill="#59636e" text-anchor="middle">the rest, by judgment</text>
<rect x="16" y="318" width="848" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="30" y="347" font-size="14" fill="#1f2328" font-weight="600">Session hooks</text>
<text x="30" y="365" font-size="13" fill="#59636e">outside the decision</text>
<rect x="192" y="330" width="156" height="42" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="270" y="347" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">session-start</text>
<text x="270" y="364" font-size="13" fill="#59636e" text-anchor="middle">at session start</text>
<rect x="360" y="330" width="156" height="42" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="438" y="347" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">pre-compact</text>
<text x="438" y="364" font-size="13" fill="#59636e" text-anchor="middle">before compaction</text>
<rect x="528" y="330" width="156" height="42" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="606" y="347" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">memory-lint</text>
<text x="606" y="364" font-size="13" fill="#59636e" text-anchor="middle">after a memory write</text>
<rect x="696" y="330" width="156" height="42" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
<text x="774" y="347" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">audit</text>
<text x="774" y="364" font-size="13" fill="#59636e" text-anchor="middle">every event, logged</text>
</svg>
